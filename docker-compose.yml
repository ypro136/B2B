name: b2b-transport-erp

x-app-environment: &app-environment
  APP_NAME: B2B Transportation ERP
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: b2b_transport_erp
  DB_USERNAME: b2b
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  PORTAL_TYPE: admin
  ADMIN_DOMAIN: ${PUBLIC_ADMIN_DOMAIN:-admin.localhost}
  COMPANY_DOMAIN: ${PUBLIC_COMPANY_DOMAIN:-company.localhost}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}

services:
  app:
    build:
      context: .
      target: runtime
    image: b2b-transport-erp:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  queue:
    image: b2b-transport-erp:local
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "false"
      SKIP_OPTIMIZE: "true"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  scheduler:
    image: b2b-transport-erp:local
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      AUTO_MIGRATE: "false"
      SKIP_OPTIMIZE: "true"
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: b2b_transport_erp
      MYSQL_USER: b2b
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  storage:
  dbdata:
